[project]
name = "tool-agent-lab"
version = "0.1.0"
description = "A from-scratch tool-calling agent loop and reflection loop for local LLMs (Ollama), with tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tool-agent = "tool_agent_lab.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
